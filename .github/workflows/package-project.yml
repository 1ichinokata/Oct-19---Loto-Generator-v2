name: Package Philippine Lotto Project

on:
  push:
    branches:
      - philippine-lotto

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove git metadata
        run: rm -rf .git
      - name: Create project ZIP
        run: zip -r Loto-Generator-Philippine-Lotto.zip . -x "*.DS_Store"
      - name: Upload project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Loto-Generator-Philippine-Lotto
          path: Loto-Generator-Philippine-Lotto.zip
